[package]
name = "forge-convert"
version = "0.1.0"
edition = "2021"

[lib]
name = "forge_convert"
path = "src/lib.rs"

[[bin]]
name = "forge-convert"
path = "src/main.rs"

[dependencies]
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
half = { version = "2", features = ["num-traits"] }
memmap2 = "0.9"
clap = { version = "4", features = ["derive"] }
# Свой форк candle (BD-001): квантование в GGML-блоки и чтение эталонного GGUF.
candle-core = { path = "../engine/candle-core", default-features = false }
