[package]
name = "candle-metal-kernels"
version = "0.11.0"
edition = "2021"

description = "Metal kernels for Candle"
repository = "https://github.com/huggingface/candle"
keywords = ["blas", "tensor", "machine-learning"]
categories = ["science"]
license = "MIT OR Apache-2.0"


[features]
default = []
# Emit per-dispatch Metal debug groups for Xcode GPU captures / Instruments.
debug-labels = []

[dependencies]
half = { version = "2.5.0", features = [
    "num-traits",
    "use-intrinsics",
    "rand_distr",
] }
once_cell = "1.21"
thiserror = "2"
tracing = "0.1.41"

# Apple-only deps: the whole crate is Metal-bindings, so src/lib.rs
# is guarded by #![cfg(target_os = "macos")]. These deps are moved under target-cond
# so objc2/block2 are not pulled into the dep-graph of Linux/Windows builds (even if
# a feature is activated upstream; on non-macOS the crate is empty and links to these
# crates are not needed).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3.2", features = ["block2"] }
block2 = { version = ">=0.6.1, <0.8.0", features = ["alloc"], default-features = false }
objc2 = "0.6.3"
objc2-foundation = "0.3.2"

[dev-dependencies]
clap = { version = "4.5.49", features = ["derive"] }
half = { version = "2.7.1", features = [
    "num-traits",
    "use-intrinsics",
    "rand_distr",
] }
anyhow = "1"
rand = "0.9.2"
rand_distr = "0.5.1"

[profile.profiling]
inherits = "release"
debug = 2
